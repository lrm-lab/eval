[project]
name = "lrm-eval-backend"
version = "0.1.0"
description = "LRM Eval Showcase & Fine-Grained Evaluation Analysis Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "argon2-cffi>=23.1.0",
    "zstandard>=0.23.0",
    "ijson>=3.3.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/home/share-data/eval/.cache/pytest"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
